<div class="flex flex-col items-start gap-y-2">
    <span>Items in cart:</span>
    <div *ngIf="cartItems$ | async as cartItems">
        <ul *ngIf="cartItems.length > 0; else emptyCart">
            <li *ngFor="let cartItem of cartItems;">
                Item: {{ cartItem.id }} - {{ cartItem.name }} x {{ cartItem.count }}
            </li>
        </ul>
    </div>

    <button class="border-black border-2 rounded p-2">Checkout</button>
</div>


<ng-template #emptyCart>
    <p>Your cart is empty.</p>
</ng-template>
