<div class="w-full h-full flex justify-center">
    <div class="flex flex-col bg-slate-200 w-1/3 shadow-md p-2 gap-y-2">
        <div class="font-bold text-xl text-center w-full">REGISTER FORM</div>
        <form class="flex flex-col" #registerForm="ngForm" (ngSubmit)="onSubmit(registerForm)">
            <mat-form-field appearance="fill">
                <mat-label>Username</mat-label>
                <input matInput placeholder="Enter your name" [(ngModel)]="user.username" required #username="ngModel"
                    name="username">
                <div *ngIf="username.invalid && username.touched" class="text-red-500">
                    <small *ngIf="username.errors?.['required']">Username is required.</small>
                </div>
            </mat-form-field>

            <mat-form-field appearance="fill">
                <mat-label>Email</mat-label>
                <input matInput placeholder="Enter your email" [(ngModel)]="user.email" required #email="ngModel" email
                    name="email">
                <div *ngIf="email.invalid && email.touched" class="text-red-500">
                    <small *ngIf="email.errors?.['required']">Email is required.</small>
                    <small *ngIf="email.errors?.['email']">Invalid email format.</small>
                </div>
            </mat-form-field>

            <mat-form-field appearance="fill">
                <mat-label>Password</mat-label>
                <input matInput placeholder="Enter your password" [(ngModel)]="user.password" required type="password"
                    #password="ngModel" minlength="6" name="password">
                <div *ngIf=" password.invalid && password.touched" class="text-red-500">
                    <small *ngIf="password.errors?.['required']">Password is required.</small>
                    <small *ngIf="password.errors?.['minlength']">
                        Password must be at least 6 characters long.
                    </small>
                </div>
            </mat-form-field>
            <button mat-flat-button type="submit" [disabled]="!registerForm.valid">Register</button>
        </form>

    </div>
</div>
